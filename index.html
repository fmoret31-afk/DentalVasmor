<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Total de Inventario</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        h2, h3 { color: var(--primary); margin-top: 0; }

        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 1rem;
        }

        .form-group { flex: 1; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        input {
            width: 100%;
            padding: 0.55rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        input:focus { outline: none; border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; margin-top: 1rem; }

        .btn {
            flex: 1;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .btn-cancel {
            background-color: #64748b;
            display: none;
        }

        .btn-cancel:hover { background-color: #475569; }

        .status {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            display: none;
            text-align: center;
        }

        .status.success { background-color: #dcfce7; color: #166534; display: block; }
        .status.error { background-color: #fee2e2; color: #991b1b; display: block; }

        .table-container { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th { background-color: #f1f5f9; color: var(--primary); font-weight: 700; }

        tr:hover { background-color: #f8fafc; }

        .btn-edit {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 5px;
        }

        .btn-edit:hover { background-color: #0369a1; }

        .btn-delete {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-delete:hover { background-color: var(--danger-hover); }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Formulario Agregar/Editar -->
    <div class="card">
        <h2 id="formTitle">Agregar / Editar Registro</h2>
        
        <form id="sheetForm">
            <input type="hidden" id="rowIndex" value="">

            <div class="row">
                <div class="form-group">
                    <label for="id">ID</label>
                    <input type="text" id="id" required>
                </div>
                <div class="form-group">
                    <label for="producto">Producto</label>
                    <input type="text" id="producto" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <input type="text" id="categoria" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="stockActual">Stock Actual</label>
                    <input type="number" id="stockActual" min="0" required>
                </div>
                <div class="form-group">
                    <label for="stockMinimo">Stock Mínimo</label>
                    <input type="number" id="stockMinimo" min="0" required>
                </div>
                <div class="form-group">
                    <label for="ubicacion">Ubicación</label>
                    <input type="text" id="ubicacion" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="caducidad">Caducidad</label>
                    <input type="text" id="caducidad" placeholder="AAAA-MM-DD" required>
                </div>
                <div class="form-group">
                    <label for="lote">Lote</label>
                    <input type="text" id="lote" required>
                </div>
                <div class="form-group">
                    <label for="proveedor">Proveedor</label>
                    <input type="text" id="proveedor" required>
                </div>
                <div class="form-group">
                    <label for="costo">Costo</label>
                    <input type="number" id="costo" step="0.01" min="0" required>
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn" id="submitBtn">Guardar en Google Sheets</button>
                <button type="button" class="btn btn-cancel" id="cancelBtn" onclick="resetForm()">Cancelar Edición</button>
            </div>
        </form>

        <div id="statusMessage" class="status"></div>
    </div>

    <!-- Tabla del Inventario con opciones para Editar y Borrar -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3>Inventario de Google Sheets</h3>
            <button class="btn" style="width: auto; padding: 0.4rem 1rem;" onclick="cargarInventario()">🔄 Actualizar Tabla</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="12">Cargando inventario...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-9rfXyVg-qOrQes41v9JfeEgFdetZAUWjq5fDfmNW8jxOEr7sz6q1NxySrNHNvGcs/exec";

    const form = document.getElementById('sheetForm');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formTitle = document.getElementById('formTitle');
    const statusMessage = document.getElementById('statusMessage');
    
    let inventarioData = [];

    window.addEventListener('DOMContentLoaded', cargarInventario);

    // Obtener y cargar la tabla desde Google Sheets
    async function cargarInventario() {
        try {
            const res = await fetch(SCRIPT_URL);
            inventarioData = await res.json();
            
            const headerRow = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');

            headerRow.innerHTML = '';
            tableBody.innerHTML = '';

            if (inventarioData.length <= 1) {
                tableBody.innerHTML = '<tr><td colspan="12">La hoja está vacía o solo contiene encabezados.</td></tr>';
                return;
            }

            // Encabezados
            inventarioData[0].forEach(col => {
                headerRow.innerHTML += `<th>${col}</th>`;
            });
            headerRow.innerHTML += `<th>Acciones</th>`;

            // Filas de datos
            for (let i = 1; i < inventarioData.length; i++) {
                const row = inventarioData[i];
                const realRowIndex = i + 1; // Índice real de fila en Google Sheets
                
                let rowHtml = '<tr>';
                row.forEach(cell => {
                    rowHtml += `<td>${cell}</td>`;
                });
                
                // Botones Editar y Borrar
                rowHtml += `<td>
                    <button class="btn-edit" onclick="prepararEdicion(${realRowIndex})">✏️ Editar</button>
                    <button class="btn-delete" onclick="eliminarFila(${realRowIndex}, '${row[1]}')">🗑️ Borrar</button>
                </td>`;
                rowHtml += '</tr>';
                
                tableBody.innerHTML += rowHtml;
            }
        } catch (error) {
            console.error("Error al cargar inventario:", error);
        }
    }

    // Cargar datos en el formulario para editar una fila
    function prepararEdicion(rowIndex) {
        const rowData = inventarioData[rowIndex - 1];

        document.getElementById('rowIndex').value = rowIndex;
        document.getElementById('id').value = rowData[0] || '';
        document.getElementById('producto').value = rowData[1] || '';
        document.getElementById('categoria').value = rowData[2] || '';
        document.getElementById('stockActual').value = rowData[3] || 0;
        document.getElementById('stockMinimo').value = rowData[4] || 0;
        document.getElementById('ubicacion').value = rowData[5] || '';
        document.getElementById('caducidad').value = rowData[6] || '';
        document.getElementById('lote').value = rowData[7] || '';
        document.getElementById('proveedor').value = rowData[8] || '';
        document.getElementById('costo').value = rowData[9] || 0;

        formTitle.textContent = `Editando Fila #${rowIndex}`;
        submitBtn.textContent = 'Guardar Cambios';
        cancelBtn.style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Función para Borrar una fila elegida
    async function eliminarFila(rowIndex, nombreProducto) {
        if (!confirm(`¿Estás seguro de que deseas eliminar el producto "${nombreProducto}" (Fila ${rowIndex})?`)) {
            return;
        }

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: "delete",
                    rowIndex: rowIndex
                })
            });

            statusMessage.className = 'status success';
            statusMessage.textContent = `Fila ${rowIndex} eliminada con éxito.`;
            setTimeout(cargarInventario, 1500);
        } catch (error) {
            statusMessage.className = 'status error';
            statusMessage.textContent = 'Error al intentar eliminar la fila.';
        }
    }

    function resetForm() {
        form.reset();
        document.getElementById('rowIndex').value = '';
        formTitle.textContent = 'Agregar / Editar Registro';
        submitBtn.textContent = 'Guardar en Google Sheets';
        cancelBtn.style.display = 'none';
    }

    // Enviar datos (Guardar / Actualizar)
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const rawRowIndex = document.getElementById('rowIndex').value;

        const payload = {
            rowIndex: rawRowIndex ? parseInt(rawRowIndex) : null,
            id: document.getElementById('id').value,
            producto: document.getElementById('producto').value,
            categoria: document.getElementById('categoria').value,
            stockActual: document.getElementById('stockActual').value,
            stockMinimo: document.getElementById('stockMinimo').value,
            ubicacion: document.getElementById('ubicacion').value,
            caducidad: document.getElementById('caducidad').value,
            lote: document.getElementById('lote').value,
            proveedor: document.getElementById('proveedor').value,
            costo: document.getElementById('costo').value
        };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Procesando...';

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            statusMessage.className = 'status success';
            statusMessage.textContent = '¡Registro guardado correctamente!';
            resetForm();
            setTimeout(cargarInventario, 1500);
        } catch (error) {
            statusMessage.className = 'status error';
            statusMessage.textContent = 'Error al guardar los cambios.';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
