<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inventario Dental</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .stock-bajo { background-color: #f8d7da !important; color: #842029; font-weight: bold; }
  </style>
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow-sm">
  <h2 class="mb-4 text-primary">📦 Inventario Dental</h2>

  <!-- Formulario de Registro -->
  <form id="formInventario" class="row g-3 mb-4">
    <input type="hidden" id="rowIndex" value="">
    <div class="col-md-2">
      <input type="text" id="id" class="form-control" placeholder="Código (ej. RES-001)" required>
    </div>
    <div class="col-md-3">
      <input type="text" id="producto" class="form-control" placeholder="Producto" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="categoria" class="form-control" placeholder="Categoría" required>
    </div>
    <div class="col-md-2">
      <input type="number" id="stockActual" class="form-control" placeholder="Stock Actual" required>
    </div>
    <div class="col-md-2">
      <input type="number" id="stockMinimo" class="form-control" placeholder="Stock Mínimo" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="ubicacion" class="form-control" placeholder="Ubicación">
    </div>
    <div class="col-md-2">
      <input type="date" id="caducidad" class="form-control">
    </div>
    <div class="col-md-2">
      <input type="text" id="lote" class="form-control" placeholder="Lote">
    </div>
    <div class="col-md-3">
      <input type="text" id="proveedor" class="form-control" placeholder="Proveedor">
    </div>
    <div class="col-md-2">
      <input type="number" step="0.01" id="costo" class="form-control" placeholder="Costo ($)" required>
    </div>
    <div class="col-md-1">
      <button type="submit" class="btn btn-success w-100">Guardar</button>
    </div>
  </form>

  <!-- Tabla de Productos -->
  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Código</th>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Stock</th>
          <th>Mínimo</th>
          <th>Ubicación</th>
          <th>Caducidad</th>
          <th>Lote</th>
          <th>Proveedor</th>
          <th>Costo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaCuerpo">
        <tr><td colspan="11" class="text-center">Cargando datos...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxyXHuB9RGzjl_zjR-MYOkF-dPJR6D_Lb8VeHIF8gISRsXsckPalyRx_hrUvuVEmtSK/exec";

  // Cargar datos al iniciar
  async function cargarInventario() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      const tbody = document.getElementById("tablaCuerpo");
      tbody.innerHTML = "";

      // Omitir la fila 0 (encabezados)
      for (let i = 1; i < data.length; i++) {
        const fila = data[i];
        const numFila = i + 1; // Índice real en Google Sheets
        const esStockBajo = Number(fila[3]) <= Number(fila[4]);

        tbody.innerHTML += `
          <tr class="${esStockBajo ? 'stock-bajo' : ''}">
            <td>${fila[0]}</td>
            <td>${fila[1]}</td>
            <td>${fila[2]}</td>
            <td>${fila[3]}</td>
            <td>${fila[4]}</td>
            <td>${fila[5]}</td>
            <td>${fila[6]}</td>
            <td>${fila[7]}</td>
            <td>${fila[8]}</td>
            <td>$${Number(fila[9]).toFixed(2)}</td>
            <td>
              <button class="btn btn-sm btn-danger" onclick="eliminarFila(${numFila})">Eliminar</button>
            </td>
          </tr>
        `;
      }
    } catch (err) {
      console.error("Error al cargar datos:", err);
    }
  }

  // Guardar o Editar Fila
  document.getElementById("formInventario").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      id: document.getElementById("id").value,
      producto: document.getElementById("producto").value,
      categoria: document.getElementById("categoria").value,
      stockActual: document.getElementById("stockActual").value,
      stockMinimo: document.getElementById("stockMinimo").value,
      ubicacion: document.getElementById("ubicacion").value,
      caducidad: document.getElementById("caducidad").value,
      lote: document.getElementById("lote").value,
      proveedor: document.getElementById("proveedor").value,
      costo: document.getElementById("costo").value,
      rowIndex: document.getElementById("rowIndex").value
    };

    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    document.getElementById("formInventario").reset();
    cargarInventario();
  });

  // Eliminar Fila
  async function eliminarFila(rowIndex) {
    if (!confirm("¿Deseas eliminar este producto?")) return;
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
    });
    cargarInventario();
  }

  cargarInventario();
</script>
</body>
</html>
