<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizador de Excel</title>
    <style>
        :root {
            --primary-color: #0f766e;
            --primary-hover: #115e59;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            background-color: #f1f5f9;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .drop-zone:hover {
            border-color: var(--primary-color);
            background-color: #f0fdf4;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        .file-info {
            margin-top: 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--primary-color);
            word-break: break-all;
        }

        .btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            display: none;
        }

        .status.success {
            background-color: #dcfce7;
            color: #166534;
            display: block;
        }

        .status.error {
            background-color: #fee2e2;
            color: #991b1b;
            display: block;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Procesar Archivo Excel</h2>
    <p>Sube tu archivo de Excel para procesar los datos y descargar la versión actualizada.</p>

    <form id="uploadForm">
        <div class="drop-zone" onclick="document.getElementById('excelFile').click()">
            <span id="dropZoneText">📁 Haz clic aquí o arrastra tu archivo Excel (.xlsx)</span>
            <input type="file" id="excelFile" name="file" accept=".xlsx, .xls" required>
            <div id="fileInfo" class="file-info"></div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Procesar y Descargar</button>
    </form>

    <div id="statusMessage" class="status"></div>
</div>

<script>
    const fileInput = document.getElementById('excelFile');
    const fileInfo = document.getElementById('fileInfo');
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    // Mostrar el nombre del archivo seleccionado
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            fileInfo.textContent = `Archivo seleccionado: ${fileInput.files[0].name}`;
        } else {
            fileInfo.textContent = '';
        }
    });

    // Manejar el envío del formulario y la descarga
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (fileInput.files.length === 0) return;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        // Feedback visual de carga
        submitBtn.disabled = true;
        submitBtn.textContent = 'Procesando archivo...';
        statusMessage.className = 'status';
        statusMessage.textContent = '';

        try {
            // Reemplaza '/api/procesar-excel' por la URL de tu endpoint backend (ej: Python/Flask, FastAPI, Node.js)
            const response = await fetch('/api/procesar-excel', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error('Ocurrió un error al procesar el archivo en el servidor.');
            }

            // Recibir el archivo binario descargable (Blob)
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            
            // Crear un enlace temporal para forzar la descarga del navegador
            const a = document.createElement('a');
            a.href = downloadUrl;
            
            // Nombre del archivo editado al descargar
            const originalName = fileInput.files[0].name.replace(/\.[^/.]+$/, "");
            a.download = `${originalName}_editado.xlsx`;
            
            document.body.appendChild(a);
            a.click();
            a.remove();
            
            // Liberar objeto URL de la memoria
            window.URL.revokeObjectURL(downloadUrl);

            statusMessage.className = 'status success';
            statusMessage.textContent = '¡Archivo procesado y descargado con éxito!';
        } catch (error) {
            statusMessage.className = 'status error';
            statusMessage.textContent = error.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Procesar y Descargar';
        }
    });
</script>

</body>
</html>
