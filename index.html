<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario (Local)</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        h2, h3 { color: var(--primary); margin-top: 0; }

        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .form-group { 
            flex: 1; 
            min-width: 180px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        input {
            width: 100%;
            padding: 0.55rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        input:focus { outline: none; border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; margin-top: 1rem; }

        .btn {
            flex: 1;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .btn-cancel {
            background-color: #64748b;
            display: none;
        }

        .btn-cancel:hover { background-color: #475569; }

        .btn-export {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-export:hover { background-color: #15803d; }

        .btn-clear-all {
            background-color: #6b7280;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-clear-all:hover { background-color: #4b5563; }

        .table-container { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th { background-color: #f1f5f9; color: var(--primary); font-weight: 700; }

        tr:hover { background-color: #f8fafc; }

        .btn-edit {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 5px;
        }

        .btn-edit:hover { background-color: #0369a1; }

        .btn-delete {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-delete:hover { background-color: var(--danger-hover); }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Formulario Agregar / Editar -->
    <div class="card">
        <h2 id="formTitle">Agregar / Editar Registro</h2>
        
        <form id="inventoryForm">
            <!-- Guarda la posición de la fila a editar (-1 si es nuevo) -->
            <input type="hidden" id="editIndex" value="-1">

            <div class="row">
                <div class="form-group">
                    <label for="id">ID / Código</label>
                    <input type="text" id="id" required>
                </div>
                <div class="form-group">
                    <label for="producto">Producto</label>
                    <input type="text" id="producto" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <input type="text" id="categoria" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="stockActual">Stock Actual</label>
                    <input type="number" id="stockActual" min="0" required>
                </div>
                <div class="form-group">
                    <label for="stockMinimo">Stock Mínimo</label>
                    <input type="number" id="stockMinimo" min="0" required>
                </div>
                <div class="form-group">
                    <label for="ubicacion">Ubicación</label>
                    <input type="text" id="ubicacion" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="caducidad">Caducidad</label>
                    <input type="text" id="caducidad" placeholder="AAAA-MM-DD" required>
                </div>
                <div class="form-group">
                    <label for="lote">Lote</label>
                    <input type="text" id="lote" required>
                </div>
                <div class="form-group">
                    <label for="proveedor">Proveedor</label>
                    <input type="text" id="proveedor" required>
                </div>
                <div class="form-group">
                    <label for="costo">Costo ($/S/.)</label>
                    <input type="number" id="costo" step="0.01" min="0" required>
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn" id="submitBtn">➕ Agregar Registro</button>
                <button type="button" class="btn btn-cancel" id="cancelBtn" onclick="resetForm()">Cancelar Edición</button>
            </div>
        </form>
    </div>

    <!-- Tabla del Inventario Local -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;">
            <h3>Tabla de Inventario</h3>
            <div>
                <button class="btn-export" onclick="exportarCSV()">📥 Descargar en Excel (CSV)</button>
                <button class="btn-clear-all" onclick="vaciarTodo()">🗑️ Vaciar Todo</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Stock Act.</th>
                        <th>Stock Mín.</th>
                        <th>Ubicación</th>
                        <th>Caducidad</th>
                        <th>Lote</th>
                        <th>Proveedor</th>
                        <th>Costo</th>
                        <th>Fecha Registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Las filas se cargan dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const form = document.getElementById('inventoryForm');
    const editIndexInput = document.getElementById('editIndex');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const tableBody = document.getElementById('tableBody');

    // Cargar inventario guardado en el navegador o iniciar vacío
    let inventario = JSON.parse(localStorage.getItem('inventarioData')) || [];

    // Inicializar la tabla al cargar la página
    window.addEventListener('DOMContentLoaded', renderTabla);

    // Renderizar la tabla con los elementos actuales
    function renderTabla() {
        tableBody.innerHTML = '';

        if (inventario.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="12" style="text-align:center; color: #64748b;">No hay registros cargados en el inventario.</td></tr>';
            return;
        }

        inventario.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.id}</td>
                <td><strong>${item.producto}</strong></td>
                <td>${item.categoria}</td>
                <td>${item.stockActual}</td>
                <td>${item.stockMinimo}</td>
                <td>${item.ubicacion}</td>
                <td>${item.caducidad}</td>
                <td>${item.lote}</td>
                <td>${item.proveedor}</td>
                <td>S/. ${parseFloat(item.costo).toFixed(2)}</td>
                <td><small>${item.fechaRegistro}</small></td>
                <td>
                    <button class="btn-edit" onclick="prepararEdicion(${index})">✏️ Editar</button>
                    <button class="btn-delete" onclick="eliminarFila(${index})">🗑️ Borrar</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // Guardar (Agregar o Editar)
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const index = parseInt(editIndexInput.value);
        const fechaActual = new Date().toLocaleString();

        const registro = {
            id: document.getElementById('id').value,
            producto: document.getElementById('producto').value,
            categoria: document.getElementById('categoria').value,
            stockActual: document.getElementById('stockActual').value,
            stockMinimo: document.getElementById('stockMinimo').value,
            ubicacion: document.getElementById('ubicacion').value,
            caducidad: document.getElementById('caducidad').value,
            lote: document.getElementById('lote').value,
            proveedor: document.getElementById('proveedor').value,
            costo: document.getElementById('costo').value,
            fechaRegistro: index >= 0 ? inventario[index].fechaRegistro : fechaActual
        };

        if (index >= 0) {
            // Actualizar fila existente
            inventario[index] = registro;
        } else {
            // Agregar nueva fila
            inventario.push(registro);
        }

        guardarEnLocalStorage();
        renderTabla();
        resetForm();
    });

    // Cargar datos en el formulario para editar
    function prepararEdicion(index) {
        const item = inventario[index];

        editIndexInput.value = index;
        document.getElementById('id').value = item.id;
        document.getElementById('producto').value = item.producto;
        document.getElementById('categoria').value = item.categoria;
        document.getElementById('stockActual').value = item.stockActual;
        document.getElementById('stockMinimo').value = item.stockMinimo;
        document.getElementById('ubicacion').value = item.ubicacion;
        document.getElementById('caducidad').value = item.caducidad;
        document.getElementById('lote').value = item.lote;
        document.getElementById('proveedor').value = item.proveedor;
        document.getElementById('costo').value = item.costo;

        formTitle.textContent = `Editando: ${item.producto}`;
        submitBtn.textContent = '💾 Guardar Cambios';
        cancelBtn.style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Eliminar una fila elegida
    function eliminarFila(index) {
        const productoNombre = inventario[index].producto;
        if (confirm(`¿Estás seguro de que quieres borrar "${productoNombre}"?`)) {
            inventario.splice(index, 1);
            guardarEnLocalStorage();
            renderTabla();
        }
    }

    // Vaciar toda la tabla
    function vaciarTodo() {
        if (inventario.length === 0) return;
        if (confirm('⚠️ ¿Quieres eliminar TODOS los registros de la tabla? Esta acción no se puede deshacer.')) {
            inventario = [];
            guardarEnLocalStorage();
            renderTabla();
        }
    }

    // Reiniciar formulario
    function resetForm() {
        form.reset();
        editIndexInput.value = '-1';
        formTitle.textContent = 'Agregar / Editar Registro';
        submitBtn.textContent = '➕ Agregar Registro';
        cancelBtn.style.display = 'none';
    }

    // Guardar los datos en el navegador
    function guardarEnLocalStorage() {
        localStorage.setItem('inventarioData', JSON.stringify(inventario));
    }

    // Exportar la tabla a un archivo CSV (Excel)
    function exportarCSV() {
        if (inventario.length === 0) {
            alert("No hay datos para exportar.");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "ID,Producto,Categoria,Stock Actual,Stock Minimo,Ubicacion,Caducidad,Lote,Proveedor,Costo,Fecha Registro\n";

        inventario.forEach(item => {
            const row = [
                `"${item.id}"`,
                `"${item.producto}"`,
                `"${item.categoria}"`,
                item.stockActual,
                item.stockMinimo,
                `"${item.ubicacion}"`,
                `"${item.caducidad}"`,
                `"${item.lote}"`,
                `"${item.proveedor}"`,
                item.costo,
                `"${item.fechaRegistro}"`
            ];
            csvContent += row.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "inventario.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
