<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Registro a Google Sheets</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        input, select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.2);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            display: none;
            text-align: center;
        }

        .status.success {
            background-color: #dcfce7;
            color: #166534;
            display: block;
        }

        .status.error {
            background-color: #fee2e2;
            color: #991b1b;
            display: block;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Nuevo Registro de Inventario</h2>

    <form id="sheetForm">
        <div class="row">
            <div class="form-group">
                <label for="id">ID</label>
                <input type="text" id="id" placeholder="Ej: RES-002" required>
            </div>
            <div class="form-group">
                <label for="producto">Producto</label>
                <input type="text" id="producto" placeholder="Nombre del producto" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" placeholder="Ej: Consumibles" required>
            </div>
            <div class="form-group">
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion" placeholder="Ej: Box 1" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="stockActual">Stock Actual</label>
                <input type="number" id="stockActual" min="0" required>
            </div>
            <div class="form-group">
                <label for="stockMinimo">Stock Mínimo</label>
                <input type="number" id="stockMinimo" min="0" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="caducidad">Caducidad</label>
                <input type="date" id="caducidad" required>
            </div>
            <div class="form-group">
                <label for="lote">Lote</label>
                <input type="text" id="lote" placeholder="Ej: LOTE-123" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="proveedor">Proveedor</label>
                <input type="text" id="proveedor" placeholder="Nombre proveedor" required>
            </div>
            <div class="form-group">
                <label for="costo">Costo</label>
                <input type="number" id="costo" step="0.01" min="0" required>
            </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Enviar a Google Sheets</button>
    </form>

    <div id="statusMessage" class="status"></div>
</div>

<script>
    const form = document.getElementById('sheetForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    // URL de tu Web App de Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-9rfXyVg-qOrQes41v9JfeEgFdetZAUWjq5fDfmNW8jxOEr7sz6q1NxySrNHNvGcs/exec";

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Construir la estructura del payload que tu backend procesa
        const payload = {
            repository: { name: document.getElementById('producto').value },
            ref: document.getElementById('categoria').value,
            pusher: { name: document.getElementById('stockActual').value },
            head_commit: {
                message: document.getElementById('stockMinimo').value,
                url: document.getElementById('ubicacion').value
            },
            // Datos directos
            customData: {
                id: document.getElementById('id').value,
                caducidad: document.getElementById('caducidad').value,
                lote: document.getElementById('lote').value,
                proveedor: document.getElementById('proveedor').value,
                costo: document.getElementById('costo').value
            }
        };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando...';
        statusMessage.className = 'status';
        statusMessage.textContent = '';

        try {
            // Se utiliza mode: 'no-cors' para evitar bloqueos CORS con Apps Script Web Apps
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });

            statusMessage.className = 'status success';
            statusMessage.textContent = '¡Registro agregado correctamente en la Hoja de Cálculo!';
            form.reset();
        } catch (error) {
            statusMessage.className = 'status error';
            statusMessage.textContent = 'Error al enviar los datos. Revisa la consola.';
            console.error('Error:', error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Enviar a Google Sheets';
        }
    });
</script>

</body>
</html>
